# Replace the client_id and URLs after creating the app in Shopify Dev Dashboard.
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
name = "ShopReply"
application_url = "https://YOUR_APP_HOST/shopify"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Manual policy and FAQ entry; billing and app-owned metafields need no content scopes.
scopes = ""
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://YOUR_APP_HOST/shopify"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app_subscriptions/update"]
uri = "/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/shopify/webhooks"
